name: Cleanup older releases once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-releases-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all releases except v0.15.74
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          KEEP_TAG: v0.15.74
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          keep = os.environ["KEEP_TAG"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          page = 1
          deleted = []
          kept = []
          while True:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}",
                  headers=headers,
              )
              with urllib.request.urlopen(req) as response:
                  releases = json.load(response)
              if not releases:
                  break
              for release in releases:
                  tag = release["tag_name"]
                  if tag == keep:
                      kept.append(tag)
                      continue
                  delete_req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/releases/{release['id']}",
                      headers=headers,
                      method="DELETE",
                  )
                  with urllib.request.urlopen(delete_req) as response:
                      response.read()
                  deleted.append(tag)
                  print(f"Deleted release {tag}")
              page += 1

          print(f"Kept releases: {', '.join(kept) or 'none'}")
          print(f"Deleted {len(deleted)} older releases")
          PY
