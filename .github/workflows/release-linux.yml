name: Build Linux executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install Flask>=3.0 Pillow>=10.0 "zstandard>=0.21" pyinstaller>=6.0
          pip install trimesh>=4.0 numpy>=1.24 imageio>=2.30 "OpenEXR>=3.4"
          pip install opencv-python-headless>=4.8

      - name: Build Hangar (onedir)
        run: >
          pyinstaller --name Hangar
          --add-data "static:static"
          --add-data "worker_main.py:."
          --add-data "worker.py:."
          --add-data "store.py:."
          --add-data "thumbs.py:."
          --add-data "scanner.py:."
          --collect-all trimesh
          --collect-all cv2
          --hidden-import imageio
          --hidden-import numpy
          --hidden-import OpenEXR
          --hidden-import Imath
          --hidden-import worker
          desktop.py

      - name: Tarball the build folder
        run: tar -C dist/Hangar -czf dist/Hangar-linux.tar.gz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hangar-linux
          path: dist/Hangar-linux.tar.gz

      # Do not attach the Linux package to the public release from this workflow.
      # The Windows in-app updater watches the latest release, and if Linux wins
      # the race it can briefly see only Hangar-linux.tar.gz. Windows owns release
      # creation so Hangar-windows.zip is present before update checks see the tag.
